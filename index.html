<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#167e66"><title>美味餐厅 · 自助点餐演示</title><link rel="icon" href="assets/avatar.png"><link rel="stylesheet" href="styles.css"></head>
<body><div class="app"><header class="hero"><div class="topline"><span>欢迎光临 · 自助点餐</span><span class="demo">DEMO</span></div><div class="brand"><img src="assets/avatar.png" alt="餐厅头像"><div><h1>美味餐厅</h1><p>今天想吃点什么？</p></div></div><p class="note">个人学习演示 · 不提供真实餐饮服务</p></header><main><div class="section-title"><strong>请选择喜欢的菜品</strong><button class="link" id="historyBtn">历史订单 ›</button></div><nav id="categories" aria-label="菜品分类"></nav><div id="dishes" class="dishes"></div></main><div class="bottom"><button id="cartBtn" class="cart-button" aria-label="查看购物车"><span>🛒</span><span><b id="cartTotal">¥0.00</b><small id="cartCount">0 件菜品 · 点击查看购物车</small></span></button><button id="submitBtn" class="submit">提交订单</button></div></div>
<div id="overlay" class="overlay hidden" aria-hidden="true"><section class="sheet" role="dialog" aria-modal="true" aria-label="购物车"><div class="sheet-head"><h2>购物车</h2><button id="closeCart" class="close" aria-label="关闭">×</button></div><div id="cartItems"></div><div class="sheet-foot"><span id="sheetTotal">合计 ¥0.00</span><button id="sheetSubmit" class="submit">提交订单</button></div></section></div>
<div id="pageOverlay" class="page-overlay hidden" aria-hidden="true"><section class="panel"><div class="panel-head"><button id="backBtn" class="back">‹ 返回菜单</button><h2 id="panelTitle"></h2></div><div id="panelContent"></div></section></div>
<div id="toast" class="toast hidden" role="status"></div><script src="script.js"></script></body></html>
